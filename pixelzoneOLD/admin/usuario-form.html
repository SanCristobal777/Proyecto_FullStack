<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Panel de administración de PixelZone">
    <title>Usuario · Administración | PixelZone</title>
    <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/admin.css">
  </head>
  <body data-pagina="admin-usuario-form" data-base="../" data-roles="Administrador">
    <div class="admin-layout">
      <aside class="menu-lateral" aria-label="Menú de administración">
        <a class="marca" href="index.html"><img src="../img/logo.svg" alt="" width="32" height="32"> PixelZone</a>
        <ul class="nav flex-column py-2">
          <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-speedometer2" aria-hidden="true"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html"><i class="bi bi-controller" aria-hidden="true"></i> Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="ordenes.html"><i class="bi bi-receipt" aria-hidden="true"></i> Órdenes</a></li>
          <li class="nav-item" data-solo-admin><a class="nav-link active" aria-current="page" href="usuarios.html"><i class="bi bi-people" aria-hidden="true"></i> Usuarios</a></li>
          <li class="nav-item"><a class="nav-link" href="../index.html"><i class="bi bi-shop" aria-hidden="true"></i> Ver tienda</a></li>
        </ul>
        <div class="pie-menu">
          <div>
            <span class="d-block fw-semibold" data-nombre-usuario></span>
            <span class="text-white-50" data-perfil-usuario></span>
          </div>
          <button type="button" class="btn btn-sm btn-outline-light mt-md-2" data-cerrar-sesion>Cerrar sesión</button>
        </div>
      </aside>

      <main class="admin-contenido">
        <nav aria-label="Ruta de navegación"><ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="usuarios.html">Usuarios</a></li>
          <li class="breadcrumb-item active" aria-current="page">Formulario</li>
        </ol></nav>
        <h1 id="titulo-form" class="mb-4">Nuevo usuario</h1>
        <form id="form-usuario" class="caja-formulario p-4" novalidate>
          <div class="row g-3">
              <div class="col-md-6">
                <label for="run" class="form-label fw-semibold">RUN</label>
                <input type="text" class="form-control" id="run" name="run" autocomplete="off" placeholder="123456785">
                <div class="form-text" id="run-ayuda">Sin puntos ni guion. Ej: 123456785</div>
                <div class="invalid-feedback" id="run-error"></div>
              </div>
              <div class="col-md-6">
                <label for="fechaNacimiento" class="form-label fw-semibold">Fecha de nacimiento <span class="text-body-secondary fw-normal">(opcional)</span></label>
                <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento" >
                
                <div class="invalid-feedback" id="fechaNacimiento-error"></div>
              </div>
              <div class="col-md-6">
                <label for="nombre" class="form-label fw-semibold">Nombre</label><small class="float-end text-body-secondary" data-contador="nombre" data-max="50">0/50</small>
                <input type="text" class="form-control" id="nombre" name="nombre" autocomplete="given-name">
                
                <div class="invalid-feedback" id="nombre-error"></div>
              </div>
              <div class="col-md-6">
                <label for="apellidos" class="form-label fw-semibold">Apellidos</label><small class="float-end text-body-secondary" data-contador="apellidos" data-max="100">0/100</small>
                <input type="text" class="form-control" id="apellidos" name="apellidos" autocomplete="family-name">
                
                <div class="invalid-feedback" id="apellidos-error"></div>
              </div>
              <div class="col-12">
                <label for="correo" class="form-label fw-semibold">Correo</label>
                <input type="email" class="form-control" id="correo" name="correo" autocomplete="email" placeholder="nombre@duoc.cl">
                <div class="form-text" id="correo-ayuda">Solo @duoc.cl, @profesor.duoc.cl o @gmail.com.</div>
                <div class="invalid-feedback" id="correo-error"></div>
              </div>
              <div class="col-md-6">
                <label for="tipo" class="form-label fw-semibold">Tipo de usuario</label>
                <select class="form-select" id="tipo" name="tipo">
                  <option value="">-- Seleccione el perfil --</option>
                  <option>Administrador</option>
                  <option>Vendedor</option>
                  <option>Cliente</option>
                </select>
                <div class="invalid-feedback" id="tipo-error"></div>
              </div>
              <div class="col-md-6">
                <label for="password" class="form-label fw-semibold">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" autocomplete="new-password">
                <div class="form-text" id="password-ayuda">Entre 4 y 10 caracteres.</div>
                <div class="invalid-feedback" id="password-error"></div>
              </div>
              <div class="col-md-6">
                <label for="region" class="form-label fw-semibold">Región</label>
                <select class="form-select" id="region" name="region" ></select>
                
                <div class="invalid-feedback" id="region-error"></div>
              </div>
              <div class="col-md-6">
                <label for="comuna" class="form-label fw-semibold">Comuna</label>
                <select class="form-select" id="comuna" name="comuna" disabled></select>
                
                <div class="invalid-feedback" id="comuna-error"></div>
              </div>
              <div class="col-12">
                <label for="direccion" class="form-label fw-semibold">Dirección</label><small class="float-end text-body-secondary" data-contador="direccion" data-max="300">0/300</small>
                <textarea class="form-control" id="direccion" name="direccion" rows="3" autocomplete="street-address"></textarea>
                
                <div class="invalid-feedback" id="direccion-error"></div>
              </div>
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="submit" id="btn-guardar" class="btn btn-pz">Crear usuario</button>
            <a href="usuarios.html" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/datos.js"></script>
    <script src="../js/regiones.js"></script>
    <script src="../js/almacen.js"></script>
    <script src="../js/validaciones.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
