<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Panel de administración de PixelZone">
    <title>Inicio · Administración | PixelZone</title>
    <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/admin.css">
  </head>
  <body data-pagina="admin-home" data-base="../" data-roles="Administrador,Vendedor">
    <div class="admin-layout">
      <aside class="menu-lateral" aria-label="Menú de administración">
        <a class="marca" href="index.html"><img src="../img/logo.svg" alt="" width="32" height="32"> PixelZone</a>
        <ul class="nav flex-column py-2">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html"><i class="bi bi-speedometer2" aria-hidden="true"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html"><i class="bi bi-controller" aria-hidden="true"></i> Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="ordenes.html"><i class="bi bi-receipt" aria-hidden="true"></i> Órdenes</a></li>
          <li class="nav-item" data-solo-admin><a class="nav-link" href="usuarios.html"><i class="bi bi-people" aria-hidden="true"></i> Usuarios</a></li>
          <li class="nav-item"><a class="nav-link" href="../index.html"><i class="bi bi-shop" aria-hidden="true"></i> Ver tienda</a></li>
        </ul>
        <div class="pie-menu">
          <div>
            <span class="d-block fw-semibold" data-nombre-usuario></span>
            <span class="text-white-50" data-perfil-usuario></span>
          </div>
          <button type="button" class="btn btn-sm btn-outline-light mt-md-2" data-cerrar-sesion>Cerrar sesión</button>
        </div>
      </aside>

      <main class="admin-contenido">
        <h1 class="mb-1">¡Hola, <span data-nombre-usuario></span>!</h1>
        <p class="text-body-secondary mb-4">Perfil: <span data-perfil-usuario></span>. Este es el resumen de la tienda.</p>
        <div id="resumen" class="row g-3 mb-4"></div>
        <section class="card">
          <div class="card-header fw-semibold">Productos con stock crítico</div>
          <ul id="lista-criticos" class="list-group list-group-flush"></ul>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/datos.js"></script>
    <script src="../js/regiones.js"></script>
    <script src="../js/almacen.js"></script>
    <script src="../js/validaciones.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
